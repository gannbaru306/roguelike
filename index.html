<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>弾幕カードローグライクRPG</title>
<style>
:root{
  --bg:#08080f;--bg2:#10101c;--bg3:#181828;--panel:#141428;
  --border:#28284a;--accent:#7f77dd;--a2:#5dcaa5;--a3:#ef9f27;
  --danger:#e24b4a;--text:#eeeef8;--t2:#8888b0;--t3:#505080;
  --op:#ef9f27;--fast:#5dcaa5;--excl:#e24b4a;--break:#ff6b35;
}
*{box-sizing:border-box;margin:0;padding:0;user-select:none;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
.screen{display:none;width:100%;max-width:860px;padding:12px;flex-direction:column;gap:9px;}
.screen.active{display:flex;}

/* COMMON BUTTONS & GRIDS */
.btn{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:13px;cursor:pointer;color:var(--text);transition:all .15s;}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent);}
.btn:active:not(:disabled){transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.diff-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%;max-width:420px;}

/* TITLE */
#scr-title{align-items:center;justify-content:center;min-height:100vh;gap:15px;}
.title-logo{font-size:2rem;font-weight:700;color:var(--accent);text-shadow:0 0 20px rgba(127,119,221,.4);}

/* BATTLE UI */
.btop{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.cc{background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:11px;}
.bar{height:6px;background:var(--bg3);border-radius:100px;margin-bottom:4px;}
.bf{height:100%;border-radius:100px;transition:width .3s;}
.blog{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:8px;font-size:.76rem;color:var(--t2);min-height:50px;max-height:80px;overflow-y:auto;display:flex;flex-direction:column;gap:2px;}
.hand-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.hcard{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px;cursor:pointer;position:relative;transition:all .2s;}
.hcard.locked{opacity:.4;pointer-events:none;}
.hcard.fast-play{transform:translateY(-30px);opacity:0;}

/* TOOLTIP & TOAST */
#tooltip{position:fixed;background:rgba(10,10,20,0.95);border:1px solid var(--accent);color:white;padding:10px;border-radius:8px;font-size:0.8rem;pointer-events:none;z-index:1000;display:none;max-width:250px;box-shadow:0 0 10px rgba(0,0,0,0.8);}
#enemy-toast{position:fixed;top:20px;right:-300px;background:var(--danger);color:white;padding:10px 20px;border-radius:8px 0 0 8px;font-weight:bold;transition:right 0.3s ease-out;z-index:500;box-shadow:0 0 15px rgba(226,75,74,0.6);}
#enemy-toast.show{right:0;}

/* CHEST & DFLOAT */
#chest-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);display:none;align-items:center;justify-content:center;flex-direction:column;z-index:200;}
.chest-icon{font-size:5rem;animation:shake 0.5s ease-in-out 3;}
@keyframes shake{ 0%,100%{transform:rotate(0deg);} 25%{transform:rotate(-10deg);} 75%{transform:rotate(10deg);} }
.chest-reward{font-size:1.5rem;font-weight:bold;margin-top:20px;opacity:0;transform:scale(0.5);transition:all 0.5s;}
.chest-reward.show{opacity:1;transform:scale(1);}
.dfloat{position:fixed;font-weight:900;font-size:1.5rem;pointer-events:none;animation:flu 1.1s ease-out forwards;z-index:200;text-shadow:0 0 5px black;}
@keyframes flu{0%{transform:translateY(0);opacity:1;}100%{transform:translateY(-60px);opacity:0;}}
.dmg-red{color:#ff4444;font-size:1.8rem;}
.dmg-gold{color:#ffd700;font-size:2.2rem;text-shadow:0 0 10px #ff8800;}
.dmg-miss{color:#aaccff;font-size:1.4rem;font-style:italic;}

/* BADGES & TAGS */
.rar-common{color:var(--t2);} .rar-rare{color:#78c4ff;} .rar-epic{color:#c77dff;} .rar-legendary{color:#ffd700;}
.stags{display:flex;flex-wrap:wrap;gap:3px;margin-top:4px;}
.stag{font-size:.65rem;padding:2px 6px;border-radius:100px;border:1px solid;color:var(--t2);border-color:var(--border);}

/* LIBRARY (図鑑) */
.lib-controls{display:flex;gap:5px;flex-wrap:wrap;background:var(--bg2);padding:10px;border-radius:8px;border:1px solid var(--border);}
.lib-controls input, .lib-controls select{background:var(--bg3);color:var(--text);border:1px solid var(--border);padding:6px;border-radius:6px;font-size:0.8rem;}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;overflow-y:auto;max-height:65vh;padding-right:5px;}
.lib-card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px;}

/* REWARD & POPUPS */
.card-pick{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;}
.card-pick:hover{border-color:var(--accent);}
.popup{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:60;}
.popup.show{display:flex;}
.pop-in{background:var(--panel);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:15px;width:100%;max-width:860px;max-height:75vh;overflow-y:auto;}
</style>
</head>
<body>

<div id="tooltip"></div>
<div id="enemy-toast">敵が行動</div>
<div id="chest-overlay"><div class="chest-icon">📦</div><div class="chest-reward" id="chest-reward"></div></div>

<div class="screen" id="scr-title">
  <div class="title-logo">弾幕 ✦ カードRPG</div>
  <div style="color:var(--t2);font-size:.88rem;">最高到達: <span id="max-floor-disp">0</span>階</div>
  
  <div class="diff-grid" style="margin-top:10px">
    <button class="btn" style="border-color:var(--a3);color:var(--a3)" onclick="openLibrary()">📖 カード図鑑</button>
    <button class="btn" onclick="openEditor()">📝 tag_card.txt</button>
  </div>

  <div style="font-size:.8rem;color:var(--t3);margin-top:15px">難易度を選択して開始</div>
  <div class="diff-grid">
    <button class="btn" style="border-color:var(--a2)" onclick="startGame('easy')">Easy</button>
    <button class="btn" onclick="startGame('normal')">Normal</button>
    <button class="btn" onclick="startGame('hard')">Hard</button>
    <button class="btn" style="border-color:var(--danger)" onclick="startGame('lunatic')">Lunatic</button>
  </div>
</div>

<div class="screen" id="scr-library">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <div style="font-size:1.2rem;font-weight:bold;color:var(--a3)">📖 カード図鑑</div>
    <button class="btn" style="padding:6px 12px" onclick="showScr('title')">戻る</button>
  </div>
  
  <div class="lib-controls">
    <input type="text" id="lib-search" placeholder="名前で検索..." onkeyup="renderLibrary()">
    <select id="lib-type" onchange="renderLibrary()">
      <option value="all">すべて</option><option value="skill">スキル</option><option value="passive">パッシブ</option>
    </select>
    <select id="lib-attr" onchange="renderLibrary()">
      <option value="all">全属性</option><option value="無">無</option><option value="斬">斬</option><option value="打">打</option><option value="炎">炎</option><option value="氷">氷</option><option value="雷">雷</option><option value="風">風</option><option value="光">光</option><option value="闇">闇</option>
    </select>
    <select id="lib-sort" onchange="renderLibrary()">
      <option value="id">ID順</option><option value="rarity">レア度順</option><option value="atk">総攻撃力順</option><option value="heal">回復力順</option><option value="evade">回避力順</option>
    </select>
  </div>
  
  <div class="lib-grid" id="lib-grid"></div>
</div>

<div class="screen" id="scr-battle">
  <div class="btop">
    <div class="cc">
      <div style="font-weight:bold;margin-bottom:5px">プレイヤー <span style="font-size:0.7rem;color:var(--a3)">Lv<span id="p-lv">1</span></span></div>
      <div style="font-size:0.7rem;display:flex;justify-content:space-between"><span>HP</span><span id="p-hp-t">100/100</span></div>
      <div class="bar"><div class="bf" id="p-hp-b" style="background:#e24b4a;width:100%"></div></div>
      <div style="font-size:0.7rem;display:flex;justify-content:space-between"><span>SP</span><span id="p-sp-t">6/6</span></div>
      <div class="bar"><div class="bf" id="p-sp-b" style="background:#378add;width:100%"></div></div>
      <div style="font-size:0.7rem;display:flex;justify-content:space-between"><span>OP</span><span id="p-op-t">0/100</span></div>
      <div class="bar"><div class="bf" id="p-op-b" style="background:var(--op);width:0%"></div></div>
      <div class="stags" id="p-stags"></div>
    </div>
    <div class="cc">
      <div style="font-weight:bold;margin-bottom:5px"><span id="e-nm">敵</span> <span style="font-size:0.7rem;color:var(--t2)" id="e-fl">F1</span></div>
      <div style="font-size:0.7rem;display:flex;justify-content:space-between"><span>HP</span><span id="e-hp-t">80/80</span></div>
      <div class="bar"><div class="bf" id="e-hp-b" style="background:#e24b4a;width:100%"></div></div>
      <div style="font-size:0.7rem;display:flex;justify-content:space-between"><span>敵OP</span><span id="e-op-t">0/100</span></div>
      <div class="bar"><div class="bf" id="e-op-b" style="background:var(--op);width:0%"></div></div>
      <div class="stags" id="e-stags"></div>
    </div>
  </div>
  <div class="blog" id="blog"></div>
  
  <div style="font-size:.75rem;color:var(--t2);display:flex;gap:15px;margin-top:5px">
    <span>山札: <b id="deck-cnt" style="color:var(--text)">0</b></span>
    <span>手札: <b id="hand-cnt" style="color:var(--text)">0</b></span>
    <span>捨札: <b id="disc-cnt" style="color:var(--text)">0</b></span>
    <span>除外: <b id="excl-cnt" style="color:var(--danger)">0</b></span>
  </div>
  
  <div class="hand-grid" id="hand-grid"></div>
  
  <div style="display:flex;gap:8px;margin-top:5px">
    <button class="btn" id="btn-sc" style="flex:2;border-color:var(--op);color:var(--op)" onclick="castSpellcard()" disabled>◈ スペカ (0/100)</button>
    <button class="btn" style="flex:1" onclick="endTurn()">⏩ 終了</button>
  </div>
</div>

<div class="screen" id="scr-result">
  <div style="font-size:2.5rem;font-weight:900" id="res-t">VICTORY</div>
  <div style="background:var(--panel);padding:15px;border-radius:10px;width:100%;max-width:400px;text-align:center;border:1px solid var(--border)">
    <div style="color:var(--t2);font-size:0.8rem">到達フロア</div>
    <div style="font-size:1.5rem;font-weight:bold;color:var(--accent)" id="res-fl">1</div>
    <div style="color:var(--t2);font-size:0.8rem;margin-top:10px">最大ダメージ</div>
    <div style="font-size:1.5rem;font-weight:bold;color:var(--a3)" id="res-dmg">0</div>
  </div>
  <button class="btn" style="width:100%;max-width:400px" id="res-btn" onclick="nextFloor()">次へ進む</button>
  <button class="btn" style="width:100%;max-width:400px;color:var(--t3);display:none" id="res-title-btn" onclick="location.reload()">タイトルへ戻る</button>
</div>

<div class="screen" id="scr-reward">
  <div style="font-size:1.2rem;font-weight:bold;color:var(--a2);text-align:center">戦利品を選択</div>
  <div id="reward-cards"></div>
  <button class="btn" style="margin-top:10px;color:var(--t3)" onclick="skipReward()">スキップ</button>
</div>

<div class="screen" id="scr-town">
  <div style="font-size:1.5rem;font-weight:bold;color:var(--a2)">休憩所</div>
  <div style="display:flex;gap:10px;margin:10px 0">
    <div style="flex:1;background:var(--panel);padding:10px;border-radius:8px;text-align:center">CP: <span id="t-cp" style="color:var(--a3);font-weight:bold">0</span></div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
    <button class="btn" onclick="townHeal()">💊 全回復 (CP:20)</button>
    <button class="btn" onclick="alert('ショップ・強化画面を開きます(省略実装)')">🛒 ショップ</button>
  </div>
  <button class="btn" style="margin-top:20px" onclick="nextFloor()">▶ 次の階層へ</button>
</div>

<div class="screen" id="scr-editor">
  <div style="display:flex;justify-content:space-between"><span style="font-size:1.2rem;font-weight:bold;color:var(--a3)">📝 エディタ</span><button class="btn" style="padding:6px" onclick="showScr('title')">戻る</button></div>
  <textarea id="ed-area" spellcheck="false" style="width:100%;height:50vh;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:7px;padding:11px;font-family:monospace;font-size:.78rem;"></textarea>
  <button class="btn" style="border-color:var(--a2);color:var(--a2)" onclick="applyEditor()">✔ 反映</button>
</div>

<script>
let SKILL_DB=[], PASSIVE_DB=[], ENEMY_DB=[];
let G = {};
let maxFloorReached = parseInt(localStorage.getItem('maxFloor') || '0');
document.getElementById('max-floor-disp').textContent = maxFloorReached;

const BUILTIN_TXT = `[SKILL]
1 |斬撃         |ATTR:斬 ATK:1.2 HIT:1                           |1|common   |基本の斬撃
2 |連撃         |ATTR:打 ATK:0.7 HIT:3                           |2|common   |3連撃。OP稼ぎに
3 |毒針         |ATTR:無 ATK:0.6 HIT:1 STATUS:POISON:70:3        |1|common   |毒付与(70%)
4 |炎の矢       |ATTR:炎 ATK:1.5 HIT:1 STATUS:BURN:40:2          |1|common   |確率で燃焼付与
5 |氷の矢       |ATTR:氷 ATK:1.4 HIT:1                           |1|common   |氷属性の基本攻撃
6 |風の刃       |ATTR:風 ATK:0.8 HIT:2 FAST                      |2|common   |FAST: 2連撃
7 |小回復       |ATTR:光 HEAL:20 FAST                            |1|common   |FAST: 小回復
8 |ステップ     |ATTR:無 BUFF_EVADE:20 FAST                      |1|common   |FAST: 3ターン回避+20%
9 |強斬り       |ATTR:斬 ATK:2.0 HIT:1                           |2|rare     |単発重攻撃
10|集中         |ATTR:無 BUFF_ATK:150 FAST                       |1|rare     |FAST: ATKバフ
11|烈火         |ATTR:炎 ATK:1.5 HIT:1 STATUS:BURN:60:2          |2|rare     |燃焼付与(60%)
12|回復術       |ATTR:光 HEAL:40 FAST                            |2|rare     |FAST: HP回復
13|乱打         |ATTR:打 ATK:0.5 HIT:6                           |3|rare     |6連撃。トリガー稼ぎ
14|幻影         |ATTR:闇 BUFF_EVADE:50 FAST                      |2|rare     |FAST: 回避+50%
15|雷撃         |ATTR:雷 ATK:2.5 HIT:1                           |2|rare     |高威力の雷
16|ダブルエッジ |ATTR:斬 ATK:1.2 HIT:2                           |2|rare     |安定した2連撃
17|炎の乱舞     |ATTR:炎 ATK:0.8 HIT:4 STATUS:BURN:30:2          |3|rare     |4連撃＋微確率燃焼
18|吸血         |ATTR:闇 ATK:1.5 HIT:1 HEAL:15                   |2|rare     |攻撃と回復を同時に
19|氷結陣       |ATTR:氷 ATK:1.8 HIT:1 BUFF_EVADE:20             |2|rare     |攻撃しつつ回避アップ
20|ブレイク斬   |ATTR:斬 ATK:1.5 HIT:1 BREAK:3                   |2|rare     |異常の敵に3倍
21|結界砕き     |ATTR:打 ATK:3.0 HIT:1 BREAK:7                   |4|epic     |異常の敵に7倍
22|毒嵐         |ATTR:風 ATK:0.5 HIT:5 STATUS:POISON:90:4        |3|epic     |5連毒攻撃
23|ヒール波動   |ATTR:光 HEAL:80 BUFF_ATK:50 FAST                |3|epic     |FAST: 大回復＋バフ
24|天雷         |ATTR:雷 ATK:5.0 HIT:1 STATUS:BURN:80:3 EXCLUDE  |5|legendary|EXCLUDE: 1戦1回の超大技
25|無限刃       |ATTR:斬 ATK:1.0 HIT:8                           |4|legendary|8連撃
26|魔砲         |ATTR:魔 ATK:5.0 HIT:1 BREAK:10 EXCLUDE          |5|legendary|EXCLUDE: 必中ブレイク大技
27|バフ連撃     |ATTR:打 BUFF_ATK:100 ATK:0.8 HIT:3              |3|epic     |ATKバフ後3連撃
28|鼓舞         |ATTR:光 BUFF_ATK:200 FAST EXCLUDE               |2|legendary|EXCLUDE+FAST: 超バフ
29|魂の一撃     |ATTR:魔 ATK:4.0 HIT:1 TRIGGER:HIT:BUFF_ATK:30   |4|epic     |ヒットごとにATK+30%累積
30|毒爆符       |ATTR:闇 ATK:0.3 HIT:4 STATUS:POISON:100:3 BREAK:5|4|epic    |確定毒4連+ブレイク5倍
101|吸血牙      |ATTR:闇 ATK:1.5 HIT:1 HEAL:10                   |2|rare     |敵用: 攻撃＆回復
[PASSIVE]
p1 |戦士の気概   |BUFF_ATK_PERM:10       |common   |ATK永続+10%
p2 |魔力循環     |REGEN_SP:1             |common   |ターン開始SP+1
p10|ヒットで闘志 |TRIG_HIT_ATK:10        |epic     |ヒットごとATK+10%
p14|見切りの才   |BUFF_EVADE:10          |rare     |常時回避率+10%
[ENEMY]
ゴブリン      |60 |12 |15|8 |ゴブリン拳         |2.5|1,2,4,8
スライム      |80 |8  |18|10|溶解液             |2.0|1,3,18
スケルトン    |100|15 |20|12|骸骨の一撃         |2.8|1,9,43
魔法使い      |70 |20 |22|14|紫電一閃           |3.2|10,11,15,22
ドラゴン      |200|30 |30|30|竜炎ブレスストーム |4.0|9,11,17,32
ヴァンパイア  |150|25 |25|20|ブラッドドレイン   |3.5|9,14,18,101`;

function parseTxtData(txt){
  const skills=[], passives=[], enemies=[];
  let sec='';
  for(const line of txt.split('\n')){
    const t=line.trim(); if(!t || t.startsWith('#')) continue;
    if(t==='[SKILL]'){sec='skill';continue;} if(t==='[PASSIVE]'){sec='passive';continue;} if(t==='[ENEMY]'){sec='enemy';continue;}
    const c=t.split('|').map(s=>s.trim());
    if(sec==='skill'&&c.length>=6) skills.push({id:parseInt(c[0]),name:c[1],tags:c[2],sp:parseInt(c[3]),rarity:c[4],desc:c[5], type:'skill'});
    if(sec==='passive'&&c.length>=5) passives.push({id:c[0],name:c[1],tags:c[2],rarity:c[3],desc:c[4], type:'passive'});
    if(sec==='enemy'&&c.length>=8) enemies.push({name:c[0],hp:parseInt(c[1]),atk:parseInt(c[2]),opG:parseInt(c[3]),cp:parseInt(c[4]),spell:c[5],sMult:parseFloat(c[6]),deckIds:c[7].split(',').map(Number)});
  }
  SKILL_DB=skills; PASSIVE_DB=passives; ENEMY_DB=enemies;
}
parseTxtData(BUILTIN_TXT);

// EDITOR
function openEditor(){document.getElementById('ed-area').value=BUILTIN_TXT;showScr('editor');}
function applyEditor(){parseTxtData(document.getElementById('ed-area').value);alert('反映しました');showScr('title');}

// LIBRARY (図鑑)
function openLibrary(){ showScr('library'); renderLibrary(); }
function getCardStats(c) {
  let atk=0, heal=0, buff=0, evade=0, attr='無';
  parseTags(c.tags).forEach(t => {
    if(t.type==='ATK') atk += t.val * (parseTags(c.tags).find(x=>x.type==='HIT')?.val || 1);
    if(t.type==='HEAL') heal += t.val;
    if(t.type==='BUFF_ATK' || t.type==='BUFF_ATK_PERM') buff += t.val;
    if(t.type==='BUFF_EVADE') evade += t.val;
    if(t.type==='ATTR') attr = t.p2;
  });
  return {atk, heal, buff, evade, attr};
}
function renderLibrary(){
  const search = document.getElementById('lib-search').value.toLowerCase();
  const typeF = document.getElementById('lib-type').value;
  const attrF = document.getElementById('lib-attr').value;
  const sortF = document.getElementById('lib-sort').value;
  
  let list = [];
  if(typeF==='all' || typeF==='skill') list = list.concat(SKILL_DB);
  if(typeF==='all' || typeF==='passive') list = list.concat(PASSIVE_DB);
  
  // Stats injection for sorting/filtering
  list.forEach(c => { const s = getCardStats(c); c._stats = s; });
  
  list = list.filter(c => {
    if(search && !c.name.toLowerCase().includes(search)) return false;
    if(attrF !== 'all' && c._stats.attr !== attrF) return false;
    return true;
  });
  
  list.sort((a,b) => {
    if(sortF==='id') return parseInt(a.id) - parseInt(b.id);
    if(sortF==='rarity'){
      const r = {'common':1,'rare':2,'epic':3,'legendary':4};
      return (r[b.rarity]||0) - (r[a.rarity]||0);
    }
    if(sortF==='atk') return b._stats.atk - a._stats.atk;
    if(sortF==='heal') return b._stats.heal - a._stats.heal;
    if(sortF==='evade') return b._stats.evade - a._stats.evade;
    return 0;
  });
  
  document.getElementById('lib-grid').innerHTML = list.map(c => `
    <div class="lib-card">
      <div style="font-weight:bold;color:${c.type==='skill'?'var(--text)':'#c77dff'}">${c.name} <span style="font-size:0.7rem" class="rar-${c.rarity}">${c.rarity}</span></div>
      <div style="font-size:0.7rem;color:var(--t3)">[${c._stats.attr}] ATK:${c._stats.atk.toFixed(1)} / HEAL:${c._stats.heal} / BUFF:${c._stats.buff}% / EVADE:${c._stats.evade}%</div>
      <div style="font-size:0.7rem;color:var(--t2);margin-top:4px">${c.desc}</div>
      <div style="font-size:0.6rem;color:var(--t3);margin-top:2px">${c.tags}</div>
    </div>
  `).join('');
}

const DIFF={
  easy:   {hpM:0.5, atkM:0.5, cp:500, dropRate:0.2},
  normal: {hpM:1.0, atkM:1.0, cp:200, dropRate:0.1},
  hard:   {hpM:1.5, atkM:1.5, cp:50,  dropRate:0.05},
  lunatic:{hpM:3.0, atkM:2.5, cp:0,   dropRate:0.01}
};

function clone(obj){ return JSON.parse(JSON.stringify(obj)); }

function startGame(diff){
  const cfg = DIFF[diff];
  G = {
    diff, floor: 1, turn: 0,
    p: { hp: 100, maxHp: 100, sp: 6, maxSp: 6, op: 0, maxOp: 100, atk: 30, cp: cfg.cp,
         skills: [clone(SKILL_DB[0]), clone(SKILL_DB[1]), clone(SKILL_DB[9])], // Default: 斬撃,連撃,集中
         passives: [], statusList: [], spellcard: {name:'初期スペカ', power:10, type:'SINGLE'}, maxDamage: 0 },
    battle: { deck:[], hand:[], discard:[], excluded:[], handSize:4 },
    enemy: null
  };
  startBattle();
}

function showScr(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('scr-'+id).classList.add('active');
}

// =============================================
// TAG PARSER
// =============================================
function parseTags(str) {
  if(!str) return [];
  return str.split(/\s+/).map(s => {
    const p = s.split(':');
    return { type: p[0], val: parseFloat(p[1])||0, raw: s, p2: p[1], p3: p[2], p4: p[3] };
  });
}

// =============================================
// BATTLE SYSTEM
// =============================================
function startBattle(){
  const isBoss = G.floor % 5 === 0;
  const eBase = ENEMY_DB[Math.min(G.floor-1, ENEMY_DB.length-1)];
  const cfg = DIFF[G.diff];
  
  G.enemy = clone(eBase);
  G.enemy.hp = Math.floor(eBase.hp * cfg.hpM * (isBoss?2:1));
  G.enemy.maxHp = G.enemy.hp;
  G.enemy.atk = Math.floor(eBase.atk * cfg.atkM);
  G.enemy.op = 0; G.enemy.maxOp = 100; G.enemy.statusList = [];
  
  // 敵のデッキ構築
  G.enemy.deck = (G.enemy.deckIds || []).map(id => clone(SKILL_DB.find(s=>s.id===id))).filter(Boolean);
  
  G.p.statusList = []; G.turn = 0;
  
  // 山札初期化
  G.battle.deck = G.p.skills.map(s => clone(s));
  G.battle.deck.forEach(c => c.uid = Date.now() + Math.random());
  shuffle(G.battle.deck);
  G.battle.hand = []; G.battle.discard = []; G.battle.excluded = [];
  
  clearLog();
  addLog(`F${G.floor}: ${G.enemy.name}が現れた！${isBoss?'【BOSS】':''}`, 'sy');
  startPlayerTurn();
}

function shuffle(arr){ for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];} }

function drawCards(n){
  for(let i=0; i<n; i++){
    if(G.battle.deck.length === 0){
      if(G.battle.discard.length === 0) break;
      G.battle.deck = [...G.battle.discard]; G.battle.discard = [];
      shuffle(G.battle.deck); addLog('山札をリシャッフル！', 'sy');
    }
    G.battle.hand.push(G.battle.deck.pop());
  }
}

function startPlayerTurn(){
  G.p.sp = Math.min(G.p.maxSp, G.p.sp + 2); // 毎ターンSP回復
  // パッシブ
  G.p.passives.forEach(p => parseTags(p.tags).forEach(t => { if(t.type==='REGEN_SP') G.p.sp = Math.min(G.p.maxSp, G.p.sp+t.val); }));
  
  const need = G.battle.handSize - G.battle.hand.length;
  if(need > 0) drawCards(need);
  updateBattleUI();
}

function playCard(uid){
  const idx = G.battle.hand.findIndex(c => c.uid === uid);
  if(idx < 0) return;
  const card = G.battle.hand[idx];
  
  if(G.p.sp < card.sp) { addLog('SP不足！', 'sy'); return; }
  G.p.sp -= card.sp;
  G.p.op = Math.min(100, G.p.op + card.sp*2); 
  
  const cardEl = document.querySelectorAll('.hcard')[idx];
  G.battle.hand.splice(idx, 1);
  
  const tags = parseTags(card.tags);
  const isFast = tags.some(t=>t.type==='FAST');
  const isExcl = tags.some(t=>t.type==='EXCLUDE');
  
  if(isFast) cardEl.classList.add('fast-play');
  if(isExcl) G.battle.excluded.push(card); else G.battle.discard.push(card);
  
  execTags(tags, card.name, true);
  updateBattleUI();
  
  if(!checkEnd()){
    if(!isFast) setTimeout(enemyTurn, 500);
    else setTimeout(() => { drawCards(1); updateBattleUI(); }, 300);
  }
}

// 実行ロジック (プレイヤー/敵 兼用)
function execTags(tags, name, isPlayer){
  const attacker = isPlayer ? G.p : G.enemy;
  const target = isPlayer ? G.enemy : G.p;
  
  let hasAttack = tags.some(t => t.type==='ATK' || t.type==='HIT');
  let atkMult = 1, hits = 1, breakMult = 1, isBreak = false;
  
  tags.forEach(t => {
    if(t.type==='ATK') atkMult = t.val;
    if(t.type==='HIT') hits = t.val;
    if(t.type==='BUFF_ATK') addSt(attacker, 'BUFF_ATK', t.val, 3);
    if(t.type==='BUFF_EVADE') addSt(attacker, 'BUFF_EVADE', t.val, 3);
    if(t.type==='HEAL') { attacker.hp = Math.min(attacker.maxHp, attacker.hp+t.val); addLog(`${attacker.name||'敵'} HP+${t.val}回復！`, 'sy'); dfloat(`+${t.val}`, '#5dcaa5', isPlayer); }
    if(t.type==='BREAK') { isBreak = true; breakMult = t.val; }
  });
  
  if(!hasAttack){ addLog(`${name} を発動！`, isPlayer?'pa':'ea'); return; }
  
  // BREAK判定
  const hasAil = target.statusList.some(s => s.name==='POISON' || s.name==='BURN');
  if(isBreak && hasAil && isPlayer){
    atkMult *= breakMult;
    target.statusList = target.statusList.filter(s => s.name!=='POISON' && s.name!=='BURN');
    addLog(`💥 BREAK！異常を砕いてダメージ激増！`, 'br');
    const f = document.createElement('div'); f.className='brflash'; document.body.appendChild(f); setTimeout(()=>f.remove(), 500);
  }
  
  let totalDmg = 0;
  for(let i=0; i<hits; i++){
    // EVADE Check
    let evade = getSt(target, 'BUFF_EVADE');
    if(!isPlayer) evade += G.p.passives.reduce((s,p)=>s+parseTags(p.tags).filter(t=>t.type==='BUFF_EVADE').reduce((a,t)=>a+t.val,0),0);
    
    if (evade > 0 && Math.random()*100 < evade) {
       addLog(`${target.name||'敵'}は攻撃を回避した！`, 'sy');
       dfloat("MISS", "dmg-miss", !isPlayer);
       continue; // ダメージスキップ
    }

    let buff = getSt(attacker, 'BUFF_ATK');
    if(isPlayer) buff += G.p.passives.reduce((s,p)=>s+parseTags(p.tags).filter(t=>t.type==='BUFF_ATK_PERM').reduce((a,t)=>a+t.val,0),0);
    
    let raw = attacker.atk * atkMult * (1 + buff/100);
    if(!isPlayer) {
      const graze = Math.floor(raw * 0.1);
      G.p.op = Math.min(100, G.p.op + graze);
    }
    
    let dmg = Math.max(1, Math.floor(raw));
    target.hp = Math.max(0, target.hp - dmg);
    totalDmg += dmg;
    
    if(isPlayer){
      let dCol = dmg >= 100000 ? 'dmg-gold' : dmg >= 10000 ? 'dmg-red' : '#e24b4a';
      dfloat(dmg, dCol, isPlayer);
      if(dmg > G.p.maxDamage) G.p.maxDamage = dmg;
    } else {
      dfloat(dmg, '#c77dff', false);
    }
  }
  
  // Status付与
  tags.forEach(t => {
    if(t.type==='STATUS' && Math.random()*100 < parseFloat(t.p3)){ 
      addSt(target, t.p2, Math.floor(attacker.atk*0.3), parseInt(t.p4));
      addLog(`${target.name||'敵'}に${t.p2}付与！`, isPlayer?'pa':'ea');
    }
  });
  
  if(totalDmg > 0) addLog(`${name}！ 合計${totalDmg.toLocaleString()}ダメージ！`, isPlayer?'pa':'ea');
}

function dfloat(num, colorCls, isPlayer){
  const el = document.createElement('div');
  el.className = 'dfloat ' + (colorCls.startsWith('dmg') ? colorCls : '');
  if(!colorCls.startsWith('dmg')) el.style.color = colorCls;
  el.textContent = num;
  el.style.left = (isPlayer ? (60 + Math.random()*20) : (20 + Math.random()*20)) + '%';
  el.style.top = (30 + Math.random()*10) + '%';
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 1100);
}

function addSt(tgt, name, val, dur){
  const ex = tgt.statusList.find(s=>s.name===name);
  if(ex){ ex.val += val; ex.dur = Math.max(ex.dur, dur); }
  else tgt.statusList.push({name, val, dur});
}
function getSt(tgt, name){
  const s = tgt.statusList.find(s=>s.name===name);
  return s ? s.val : 0;
}

function endTurn(){ if(checkEnd()) return; setTimeout(enemyTurn, 300); }

function enemyTurn(){
  const e = G.enemy;
  if(e.hp <= 0) return;
  
  e.statusList.forEach(s => {
    if(s.name==='POISON' || s.name==='BURN'){
      const d = Math.max(1, Math.floor(s.val));
      e.hp -= d; addLog(`異常ダメージ: ${d}`, 'ea');
    }
    s.dur--;
  });
  e.statusList = e.statusList.filter(s=>s.dur>0);
  if(checkEnd()) return;
  
  let acts = (e.isBoss && G.floor >= 10) ? 2 : 1; // Boss double action
  
  for(let i=0; i<acts; i++){
    if(e.op >= 100){
      e.op = 0; const dmg = Math.floor(e.atk * e.sMult);
      G.p.hp -= dmg;
      showEnemyToast(`★ スペカ: ${e.spell}`);
      addLog(`★ 敵のスペルカード！ ${dmg}の大ダメージ！`, 'ea'); dfloat(dmg, '#c77dff', false);
    } else {
      e.op += e.opG;
      if(e.deck && e.deck.length > 0){
        const sk = e.deck[Math.floor(Math.random()*e.deck.length)];
        showEnemyToast(`使用: ${sk.name}`);
        execTags(parseTags(sk.tags), sk.name, false);
      } else {
        const dmg = Math.max(1, Math.floor(e.atk));
        G.p.hp -= dmg; dfloat(dmg, '#c77dff', false); addLog(`敵の通常攻撃！ ${dmg}ダメ`, 'ea');
      }
    }
    if(G.p.hp <= 0) break;
  }
  
  if(!checkEnd()) startPlayerTurn();
}

function showEnemyToast(msg){
  const el = document.getElementById('enemy-toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 2000);
}

// =============================================
// UI UPDATES & EVENTS
// =============================================
function updateBattleUI(){
  document.getElementById('p-lv').textContent = G.p.lv;
  document.getElementById('p-hp-t').textContent = `${G.p.hp}/${G.p.maxHp}`;
  document.getElementById('p-hp-b').style.width = `${(G.p.hp/G.p.maxHp)*100}%`;
  document.getElementById('p-sp-t').textContent = `${G.p.sp}/${G.p.maxSp}`;
  document.getElementById('p-sp-b').style.width = `${(G.p.sp/G.p.maxSp)*100}%`;
  document.getElementById('p-op-t').textContent = `${G.p.op}/100`;
  document.getElementById('p-op-b').style.width = `${(G.p.op/100)*100}%`;
  
  document.getElementById('e-nm').textContent = G.enemy.name + (G.enemy.isBoss?' 【BOSS】':'');
  document.getElementById('e-fl').textContent = `F${G.floor}`;
  document.getElementById('e-hp-t').textContent = `${G.enemy.hp.toLocaleString()}/${G.enemy.maxHp.toLocaleString()}`;
  document.getElementById('e-hp-b').style.width = `${(G.enemy.hp/G.enemy.maxHp)*100}%`;
  document.getElementById('e-op-t').textContent = `${G.enemy.op}/100`;
  document.getElementById('e-op-b').style.width = `${(G.enemy.op/100)*100}%`;
  
  document.getElementById('deck-cnt').textContent = G.battle.deck.length;
  document.getElementById('hand-cnt').textContent = G.battle.hand.length;
  document.getElementById('disc-cnt').textContent = G.battle.discard.length;
  document.getElementById('excl-cnt').textContent = G.battle.excluded.length;
  
  const scBtn = document.getElementById('btn-sc');
  scBtn.disabled = G.p.op < 100;
  
  const hg = document.getElementById('hand-grid');
  hg.innerHTML = G.battle.hand.map(c => {
    const locked = G.p.sp < c.sp ? 'locked' : '';
    const tags = parseTags(c.tags);
    const isFast = tags.some(t=>t.type==='FAST') ? '<span style="color:var(--fast);font-size:0.6rem;border:1px solid;padding:1px 4px;border-radius:4px">FAST</span>' : '';
    const isExcl = tags.some(t=>t.type==='EXCLUDE') ? '<span style="color:var(--excl);font-size:0.6rem;border:1px solid;padding:1px 4px;border-radius:4px">EXCL</span>' : '';
    const tooltipData = `【属性:${getCardStats(c).attr}】<br>タグ詳細: ${c.tags}<br>${c.desc}`;
    
    return `<div class="hcard ${locked}" onclick="playCard('${c.uid}')" onmouseenter="showTooltip(event, '${tooltipData}')" onmouseleave="hideTooltip()">
      <div style="font-weight:bold;font-size:0.85rem">${c.name}</div>
      <div style="font-size:0.7rem;color:var(--t2);margin:4px 0">SP: ${c.sp}</div>
      <div style="display:flex;gap:4px">${isFast}${isExcl}</div>
    </div>`;
  }).join('');
}

// Tooltip
const tooltip = document.getElementById('tooltip');
function showTooltip(e, text) { tooltip.innerHTML = text; tooltip.style.display = 'block'; tooltip.style.left = (e.clientX + 10) + 'px'; tooltip.style.top = (e.clientY + 10) + 'px'; }
function hideTooltip() { tooltip.style.display = 'none'; }
document.addEventListener('mousemove', (e) => { if(tooltip.style.display === 'block'){ tooltip.style.left = (e.clientX + 10) + 'px'; tooltip.style.top = (e.clientY + 10) + 'px'; }});

function checkEnd(){
  if(G.enemy.hp <= 0){
    G.p.cp += G.enemy.cp;
    if(G.floor > maxFloorReached) { maxFloorReached = G.floor; localStorage.setItem('maxFloor', maxFloorReached); }
    document.getElementById('res-t').textContent = 'VICTORY'; document.getElementById('res-t').style.color = 'var(--a2)';
    document.getElementById('res-fl').textContent = G.floor; document.getElementById('res-dmg').textContent = G.p.maxDamage.toLocaleString();
    document.getElementById('res-btn').style.display = 'block'; document.getElementById('res-title-btn').style.display = 'none';
    showScr('result'); return true;
  }
  if(G.p.hp <= 0){
    document.getElementById('res-t').textContent = 'GAME OVER'; document.getElementById('res-t').style.color = 'var(--danger)';
    document.getElementById('res-fl').textContent = G.floor; document.getElementById('res-dmg').textContent = G.p.maxDamage.toLocaleString();
    document.getElementById('res-btn').style.display = 'none'; document.getElementById('res-title-btn').style.display = 'block';
    showScr('result'); return true;
  }
  return false;
}

// =============================================
// REWARDS (3-Cards) & CHEST
// =============================================
function nextFloor(){
  G.floor++;
  if(G.floor % 4 === 0) { updateTownUI(); showScr('town'); return; }
  showRewardScreen();
}

function showRewardScreen(){
  const cfg = DIFF[G.diff];
  let pool = SKILL_DB;
  if(Math.random() < cfg.dropRate && G.enemy && G.enemy.deck) pool = G.enemy.deck;
  
  let choices = [];
  for(let i=0; i<3; i++) choices.push(clone(pool[Math.floor(Math.random()*pool.length)]));
  window._rewardChoices = choices;
  
  document.getElementById('reward-cards').innerHTML = choices.map((c, i) => `
    <div class="card-pick" onclick="pickReward(${i})">
      <div style="font-weight:bold;color:var(--accent)">${c.name} <span style="font-size:0.7rem;color:var(--t2)" class="rar-${c.rarity}">${c.rarity}</span></div>
      <div style="font-size:0.7rem;color:var(--t2);margin-top:5px">${c.desc}</div>
    </div>
  `).join('');
  showScr('reward');
}

function pickReward(i){
  const card = clone(window._rewardChoices[i]);
  card.uid = Date.now() + Math.random();
  G.p.skills.push(card);
  
  const overlay = document.getElementById('chest-overlay');
  const rewardTxt = document.getElementById('chest-reward');
  overlay.style.display = 'flex'; rewardTxt.classList.remove('show');
  rewardTxt.innerHTML = `<span style="color:var(--t2)">GET!</span><br>${card.name}`;
  
  setTimeout(() => {
    rewardTxt.classList.add('show');
    setTimeout(() => { overlay.style.display = 'none'; startBattle(); }, 1500);
  }, 1000);
}

function skipReward() { startBattle(); }

// =============================================
// TOWN
// =============================================
function updateTownUI(){ document.getElementById('t-cp').textContent = G.p.cp; }
function townHeal(){
  if(G.p.cp < 20) return alert('CP不足');
  G.p.cp -= 20; G.p.hp = G.p.maxHp; G.p.sp = G.p.maxSp;
  updateTownUI(); alert('全回復しました！');
}

// Utils
function clearLog(){ document.getElementById('blog').innerHTML = ''; }
function addLog(msg, cls){ const b = document.getElementById('blog'); const d = document.createElement('div'); d.className = 'le ' + cls; d.textContent = msg; b.appendChild(d); b.scrollTop = b.scrollHeight; }

// Initialize Title
document.getElementById('max-floor-disp').textContent = maxFloorReached;
showScr('title');
</script>
